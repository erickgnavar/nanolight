# Tests Nanolight and builds its app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
      - run: zig build test
      - run: zig build app
      - run: zig build -Dtarget=x86_64-windows-gnu --prefix zig-out/windows
      - run: zig build -Dtarget=x86_64-linux-gnu --prefix zig-out/linux
      - run: cd raycast && npm ci && npm test

  # The tests on Linux, where they draw with nanoui's own text and renderer.
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
      - run: zig build test
